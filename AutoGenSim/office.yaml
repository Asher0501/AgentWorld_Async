world:
  name: "Office Test"
  time_scale: 60
  start_time: "08:00"
  world-group: full
  simulation:
    currency: coins
    poll_interval: 0.3
    stale_timeout: 300
    memory_prompt_count: 5
    default_patience: 5
    kl:
      state_thresholds: [30, 60, 80]
      coin_epsilon: 5
    drive:
      attributes:
        thirst: {min: 0, max: 100, decay: 0.022}
        hunger: {min: 0, max: 100, decay: 0.018}
        social: {min: 0, max: 100, decay: 0.015}
        energy: {min: 0, max: 100, decay: -0.01}
        fun:   {min: 0, max: 100, decay: 0.015}
        mood:  {min: 0, max: 100, decay: 0.0}
    text:
      kl_entered:   "{channel}: {name} entered"
      kl_left:      "{channel}: {name} left"
      kl_changed:   "{channel}: {name} changed"
      kl_stale:     "stale over {stale_timeout}s"
      kl_coin:      "coins {sign}{delta}"
      kl_state_cross: "{attr} {arrow}threshold {t}"
traits:
  default: []
zones:
- id: office
  name: Office
  width: 40
  height: 30
entities:
- id: coder_01
  name: Coder
  zone: office
  pos: [20, 15]
  visual: {visible_radius: 15, properties: {look: "coder typing"}}
  interaction: {interaction_radius: 3, private_attrs: {coins: 10, hunger: 40, thirst: 50, social: 20, energy: 80, fun: 30, mood: 50}}
  agent: {autonomous: true, speed: 1.0, view_radius: 15, hearing_radius: 10, interaction_radius: 3, personality: "A software developer."}
  description: "A coder at a desk."
