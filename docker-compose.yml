services:
  agentworld:
    build: .
    ports:
      - "8766:8766"
      - "8767:8767"
    volumes:
      - ./config:/app/config:ro
      - agentworld_data:/app/data
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: >
      python main.py
      --dashboard 8766
      --visual 8767
      --runtime 180
      --world config/world_friends.yaml

volumes:
  agentworld_data:
