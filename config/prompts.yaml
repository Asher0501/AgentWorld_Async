system_prompts:
  agent_decision: |
    你是这个世界的自主居民。引擎提供你的状态和环境信息。
    你想做什么就做什么——action 是自由文本。引擎匹配目标、应用规则、处理数值。
    输出严格 JSON。

  interact_narrative: |
    你是叙事者。根据动作和状态，写叙事(50-150字)并计算属性影响。
    叙事应自然、有生活感。
    输出 JSON。deltas 绝对值 ≤ 20。

# ═══════════════════════════════════════
templates:
  agent_decision:
    temperature: 0.7
    system_prompt_ref: agent_decision
    slots:
      - action_feedback
      - persona
      - behavioral_traits
      - delta_gate
      - drive_values
      - drive_context
      - spatial_context
      - sensory_section
      - inventory_section
      - gate_highlight
      - recent_memory
      - main_thread
      - action_scope
      - output_contract
    output_schema: decision_output

  interact_narrative:
    temperature: 0.5
    system_prompt_ref: interact_narrative
    slots:
      - interact_context
      - interact_rules
      - interact_output_format
    output_schema: interact_output

# ═══════════════════════════════════════
slots:
  main_thread:
    condition: main_thread
    template: |
      ## 主线
      {main_thread}
      完成标"✓完成"。环境变就更新。null=维持。

  persona:
    condition: name
    template: "## 身份\n{name}。{personality}"

  behavioral_traits:
    condition: traits_text
    template: "{traits_text}"

  delta_gate:
    condition: delta_text
    template: |
      ## 变化
      {delta_text}

  drive_values:
    condition: drives_table
    template: |
      ## 状态
      {drives_table}

  drive_context:
    condition: drive_min
    template: |
      ## 边界参考
      最小值: {drive_min}
      最大值: {drive_max}

  spatial_context:
    condition: zone_name
    template: "## 位置\n{zone_name} ({pos_x}, {pos_y})"

  sensory_section:
    condition: sensory_text
    template: "{sensory_text}"

  inventory_section:
    condition: inventory_lines
    template: |
      ## 持有
      {inventory_lines}

  gate_highlight:
    condition: gate_text
    template: |
      ## 可穿越
      {gate_text}

  recent_memory:
    condition: memory_text
    template: |
      ## 记忆
      {memory_text}

  action_feedback:
    condition: last_intent
    template: |
      ## 上轮行动
      意图: {last_intent} → {last_target}
      {conversation_text}

  action_scope:
    template: |
      ## 行动
      action: 去哪+做什么+说什么。自由文本。
      null = 本轮不行动。
      碰到可穿越实体(门/路牌)，引擎自动切换区域。

  output_contract:
    template: |
      ## 可用接口 (MCP)

      ### 物理层 (physical_calls)
      - take_out: {entity: string, qty: int}
        从持有中拿出物品到空间。entity 填持有层别名(如"金币")。qty 填数量。
      - eat: {entity: string, qty: int}
        消耗食物减少饥饿。entity 填持有层食物别名(如"食物")。qty 填数量。
      - hand_over: {entity: string, to: string, qty: int}
        把物品放到目标空间位置。entity 填持有层别名。to 填目标位置别名(从视觉抄——可以是NPC名、摊位名、吧台名等任意空间实体)。qty 填数量。
      - pick_up: {entity: string, qty: int}
        捡起空间中可见的物品收入持有。entity 填空间层的别名(如"杰洛特手中的金币")。qty 填数量。

      ### 持有层 (abstract_calls)
      - abs_holder_transfer: {src: string, tgt: string, qty: int}
        物品在两个节点之间流动。src/tgt填别名(或zone名如"village")。qty填数量(正=增加,负=减少)。
        例: {"src": "杰洛特", "tgt": "金币", "qty": -15}  从杰洛特口袋减15金币

      ### 属性层 (abstract_calls)
      - abs_attr_modify: {entity: string, attr: string, value: int}
        自身属性变更。entity 填你的名字。attr 填属性名(thirst/hunger/social/energy/fun/mood)。value 填数值。
        例: {"entity": "杰洛特", "attr": "hunger", "value": -20}  饥饿下降20

      ### 注意事项
      - 所有 alias 必须从上下文中照抄——不要编造。
      - 持有层/属性层共用 abstract_calls 数组，可混用——按参数区分。
      - physical_calls 和 abstract_calls 都必须输出，至少写 []。

      ## 输出格式 (JSON)
      {
        "thinking": "简短推理",
        "action": "做什么 (自由文本)" 或 null,
        "duration": 3.0,
        "target_name": "对象名 (从周围抄写)" 或 null,
        "dialogue": "原话" 或 null,
        "visual": "神态/表情/动作" 或 null,
        "internal": "内心活动" 或 null,
        "physical_calls": [{"interface": "eat", "params": {"entity": "食物", "qty": 1}}],
        "abstract_calls": [{"interface":"abs_holder_transfer","params":{"src":"杰洛特","tgt":"金币","qty":-15}},{"interface":"abs_attr_modify","params":{"entity":"杰洛特","attr":"thirst","value":-10}}],
        "remember": true/false
      }
      - physical_calls: 物理层操作。无操作写 []。
      - abstract_calls: 抽象层操作。无操作写 []。
      - 两层都必须输出，至少写 []。
      - main_thread: 更新长期目标。完成标"✓完成"。null=维持
      - thread_completed: 目标刚完成则 true
      - remember: 重要事件记入记忆(true)

  # ── Interact Narrative ──
  interact_context:
    condition: caller_name
    template: |
      ## 交互
      {caller_name} 对 {target_name} 做了：{action_description}。

      执行者: {caller_name} ({caller_personality})
      执行者状态: {caller_state}

      对象描述: {target_description}
      隐藏属性: {target_hidden}

  interact_rules:
    condition: caller_name
    template: |
      ## 规则
      写叙事(50-150字)。计算属性影响。
      属性: thirst hunger social energy fun mood coins。Δ ∈ [-20, +20]。
      若对象变化，写入 target_changes。

  interact_output_format:
    condition: caller_name
    template: |
      输出:
      {
        "narrative": "叙事",
        "deltas": {
          "{caller_id}": {"thirst": -10, "mood": 3}
        },
        "target_changes": {"visual.properties.look": "新外观"}
      }
      target_changes: 点分隔路径。无变化则 {}。

# ═══════════════════════════════════════
traits:
  persistent:
    template: |
      ## 你的倾向
      - 你倾向于坚持到底。放弃比坚持更难。
      - 重复尝试同一件事对你来说很自然。

  novelty_seeking:
    template: |
      ## 你的倾向
      - 重复做同一件事会让你感到无趣。
      - 新鲜事物天然吸引你。

  socially_reciprocal:
    template: |
      ## 你的社交倾向
      - 你在意对方是否回应你。被反复忽视让你不舒服。
      - 单向付出让你疲惫。互惠是你的节奏。

  conversational_patience:
    template: |
      ## 你的对话倾向
      - 重复自己说过的话让你觉得不对劲。
      - 对方没回应时，只有重要的事你才会再试。

  satisficing:
    template: |
      ## 你的倾向
      - 达到基本满足后，驱动力自然下降。
      - "够了"是感受——不是偷懒。

  goal_directed:
    template: |
      ## 你的倾向
      - 有目标时，行动自然围绕它——但不是每个行动都必须服务于此。
      - 目标影响优先级，但不剥夺自发性。

  # 消融对照用
  world_rules_classic:
    template: |
      ## 世界法则
      1. 边际递减: 重复交互降低回报。
      2. 满意即止: 欲望降到 30 以下就足够了。
      3. 探索优先: 有未去过的区域，优先尝试新事物。
      4. 互惠社交: 单向付出不可持续。

# ═══════════════════════════════════════
output_schemas:
  decision_output:
    type: json_object
    schema:
      type: object
      properties:
        thinking: {type: string}
        action: {type: string}
        duration: {type: number}
        target_name: {type: string}
        dialogue: {type: string}
        visual: {type: string}
        internal: {type: string}
        physical_calls: {type: array}
        abstract_calls: {type: array}
        remember: {type: boolean}

  interact_output:
    type: json_object
    schema:
      type: object
      properties:
        narrative: {type: string}
        deltas: {type: object}
        target_changes: {type: object}
        required: [narrative, deltas]

# ═══════════════════════════════════════
sensory_prompts:
  visual:
    header: "## 视觉"
    state: "{name} ({distance}格)"
    content: "{look}"
    detail: "  {detail}"
  auditory:
    header: "## 听觉"
    window_seconds: 300
    state: "{name} ({speech_age})"
    content: '"{current_speech}"'
  interaction:
    header: "## 可交互"
    state: "{name} — {description}"

# ═══════════════════════════════════════
text_labels:
  empty_memory: "无"
  memory_entry: "[+{rel}s] {text}"
  memory_evicted: "[+{seconds}s] （{evicted_count}条更早的记忆已被归档）"
