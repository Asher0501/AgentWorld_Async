world:
  name: 猎魔人世界 - 交易经济
  time_scale: 60
  start_time: 08:00
  world-group: full
  simulation:
    currency: coins
    poll_interval: 0.3
    stale_timeout: 30
    memory_prompt_count: 5
    default_patience: 5
    kl:
      state_thresholds:
      - 30
      - 60
      - 80
      coin_epsilon: 5
    drive:
      attributes:
        thirst:
          min: 0
          max: 100
          decay: 0.022
          description: 口渴
        hunger:
          min: 0
          max: 100
          decay: 0.018
          description: 饥饿
        social:
          min: 0
          max: 100
          decay: 0.015
          description: 社交
        energy:
          min: 0
          max: 100
          decay: -0.01
          description: 体力
        fun:
          min: 0
          max: 100
          decay: 0.015
          description: 娱乐
        mood:
          min: 0
          max: 100
          decay: 0.0
          description: 心情
    validation:
      delta_max: 30
    text:
      kl_entered: '{channel}: {name} 进入'
      kl_left: '{channel}: {name} 离开'
      kl_changed: '{channel}: {name} 变化'
      kl_stale: 距上次行动已超过 {stale_timeout}s
      kl_coin: coins {sign}{delta}
      kl_state_cross: '{attr} {arrow}突破{t}'
traits:
  default:
  - persistent
  - novelty_seeking
  - socially_reciprocal
  - satisficing
  - goal_directed
